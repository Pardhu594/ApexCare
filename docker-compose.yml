services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexcare}
      POSTGRES_USER: ${POSTGRES_USER:-apexcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apexcare_dev_password}
    ports: ["5432:5432"]
    volumes: ["apexcare_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apexcare} -d ${POSTGRES_DB:-apexcare}"]
      interval: 5s
      timeout: 5s
      retries: 20
  discovery-server:
    build:
      context: ./backend
      dockerfile: ./discovery-server/Dockerfile
    ports: ["8761:8761"]
    environment: [ "EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/" ]
  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    ports: ["8080:8080"]
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on: [discovery-server]
  auth-service:
    build:
      context: ./backend
      dockerfile: ./auth-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/apexcare
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-apexcare}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-apexcare_dev_password}
      - JWT_SECRET=${JWT_SECRET:-change-this-demo-secret-to-a-long-random-value-123456}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
  patient-service:
    build:
      context: ./backend
      dockerfile: ./patient-service/Dockerfile
    ports: ["8082:8082"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/apexcare
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-apexcare}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-apexcare_dev_password}
      - JWT_SECRET=${JWT_SECRET:-change-this-demo-secret-to-a-long-random-value-123456}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
  appointment-service:
    build:
      context: ./backend
      dockerfile: ./appointment-service/Dockerfile
    ports: ["8083:8083"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/apexcare
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-apexcare}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-apexcare_dev_password}
      - JWT_SECRET=${JWT_SECRET:-change-this-demo-secret-to-a-long-random-value-123456}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
      patient-service: { condition: service_started }
  billing-service:
    build:
      context: ./backend
      dockerfile: ./billing-service/Dockerfile
    ports: ["8084:8084"]
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/apexcare
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-apexcare}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-apexcare_dev_password}
      - JWT_SECRET=${JWT_SECRET:-change-this-demo-secret-to-a-long-random-value-123456}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_started }
      patient-service: { condition: service_started }
volumes:
  apexcare_pgdata:
