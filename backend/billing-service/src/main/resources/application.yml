server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: billing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apexcare}
    username: ${SPRING_DATASOURCE_USERNAME:apexcare}
    password: ${SPRING_DATASOURCE_PASSWORD:apexcare_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-to-a-long-random-value-123456}
